# putitoutthere config — one published package: the Python SDK on PyPI.
# The Node workspace under packages/node is internal tooling (the viewer's
# frontend source and build) and is never published.

[putitoutthere]
version = 1

[[package]]
name = "agent-transcript-viewer-pypi"
kind = "pypi"
pypi = "agent-transcript-viewer"
path = "packages/python"
build = "hatch"
globs = ["packages/python/**", "LICENSE"]
