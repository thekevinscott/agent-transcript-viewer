# putitoutthere config — one published package: the Python SDK on PyPI.
# The workspace under packages/frontend is internal tooling (the viewer's
# frontend source and build) and is never published.

[putitoutthere]
version = 1

[[package]]
name = "telelux-pypi"
kind = "pypi"
pypi = "telelux"
path = "packages/python"
build = "hatch"
globs = ["packages/python/**", "LICENSE"]
