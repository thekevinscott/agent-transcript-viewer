[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-transcript-viewer"
description = "Generate and share self-contained HTML views of agent transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kevin Scott" }]
keywords = ["agents", "transcripts", "viewer", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/thekevinscott/agent-transcript-viewer"

[tool.hatch.version]
path = "src/agent_transcript_viewer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_transcript_viewer"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
